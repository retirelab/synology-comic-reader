<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"><meta name="theme-color" content="#10141b"><title>내 만화책장</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div><span class="eyebrow">MY CLOUD LIBRARY</span><h1>내 만화책장</h1></div><span class="version">v0.1.2</span></header>
<main>
<section id="login" hidden class="panel"><h2>나만의 책장에 들어가기</h2><p>시놀로지에 보관한 만화책을 여기서 읽어요.</p><form id="loginForm"><label for="password">뷰어 비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">책장 열기</button></form></section>
<section id="library" hidden><div class="bar"><button id="up">상위 폴더</button><strong id="folder">전체 책장</strong><button id="refresh">새로고침</button><button id="logout">로그아웃</button></div><input id="search" type="search" placeholder="이 폴더에서 책 찾기" aria-label="책 검색"><div id="books" class="books"></div><p class="hint">ZIP · CBZ / 필요한 페이지만 불러옵니다</p></section>
<p id="message" role="status" aria-live="polite"></p>
<section id="reader" hidden><div class="readerBar"><button id="close">← 책장</button><strong id="title"></strong><button id="direction" aria-label="읽기 방향">좌 → 우</button><button id="fit">너비 맞춤</button><button id="fullscreen">전체화면</button></div><div id="canvas"><img id="pageImage" alt="만화 페이지"><p id="pageError" role="alert" hidden></p></div><div class="readerBottom"><button id="prev">이전</button><label><input id="pageNumber" type="number" min="1" aria-label="이동할 페이지"> / <span id="total"></span></label><button id="next">다음</button><button id="retry">다시 읽기</button></div></section>
</main><script type="module" src="app.js"></script></body></html>

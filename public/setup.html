<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'"><meta name="referrer" content="no-referrer"><title>만화 뷰어 설정 파일 만들기</title><link rel="stylesheet" href="style.css"></head><body><header><div><span class="eyebrow">MY CLOUD LIBRARY</span><h1>설정 파일 만들기</h1></div><span class="version">v0.1.1</span></header><main><section class="panel"><p>비밀번호는 이 화면에서만 처리합니다. 생성된 파일에는 평문 비밀번호가 들어가지 않습니다.</p><form id="setupForm" method="post"><label for="root">만화 폴더 경로</label><input id="root" value="/volume1/comics" required><label for="newPassword">뷰어 비밀번호 (12자 이상)</label><input id="newPassword" type="password" autocomplete="new-password" required minlength="12"><label for="confirm">비밀번호 확인</label><input id="confirm" type="password" autocomplete="new-password" required minlength="12"><button id="generate" type="submit">config.php 만들기</button></form><p id="result" role="status" aria-live="polite"></p><a id="download" hidden download="config.php">config.php 다운로드</a><p>다운로드한 파일을 File Station의 공유 폴더 <strong>comic-reader-private</strong>에 업로드하세요. 위치는 <strong>/volume1/comic-reader-private/config.php</strong>입니다.</p></section></main><script type="module" src="setup.js"></script></body></html>
